name: AKS CD

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
  IMAGE_TAG: ${{ github.sha }}
  NAMESPACE: online-bookstore

jobs:
  build-push-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push catalog-service
        uses: docker/build-push-action@v5
        with:
          context: ./services/catalog-service
          file: ./services/catalog-service/CatalogService/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.DOCKERHUB_USERNAME }}/catalog-service:${{ env.IMAGE_TAG }}
            ${{ env.DOCKERHUB_USERNAME }}/catalog-service:latest

      - name: Build and push order-service
        uses: docker/build-push-action@v5
        with:
          context: ./services/OrderService
          file: ./services/OrderService/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.DOCKERHUB_USERNAME }}/order-service:${{ env.IMAGE_TAG }}
            ${{ env.DOCKERHUB_USERNAME }}/order-service:latest

      - name: Build and push api-gateway
        uses: docker/build-push-action@v5
        with:
          context: ./services/api-gateway/ApiGateway
          file: ./services/api-gateway/ApiGateway/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.DOCKERHUB_USERNAME }}/api-gateway:${{ env.IMAGE_TAG }}
            ${{ env.DOCKERHUB_USERNAME }}/api-gateway:latest

      - name: Build and push payment-service
        uses: docker/build-push-action@v5
        with:
          context: ./services/payment-service/PaymentService
          file: ./services/payment-service/PaymentService/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.DOCKERHUB_USERNAME }}/payment-service:${{ env.IMAGE_TAG }}
            ${{ env.DOCKERHUB_USERNAME }}/payment-service:latest

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Set kubeconfig
        env:
          KUBE_CONFIG_DATA: ${{ secrets.KUBE_CONFIG_DATA }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.kube"
          echo "$KUBE_CONFIG_DATA" | base64 --decode > "$HOME/.kube/config"

      - name: Deploy to AKS
        run: |
          set -euo pipefail
          kubectl set image deployment/catalog-service catalog-service=${{ env.DOCKERHUB_USERNAME }}/catalog-service:${{ env.IMAGE_TAG }} -n ${{ env.NAMESPACE }}
          kubectl set image deployment/order-service order-service=${{ env.DOCKERHUB_USERNAME }}/order-service:${{ env.IMAGE_TAG }} -n ${{ env.NAMESPACE }}
          kubectl set image deployment/api-gateway api-gateway=${{ env.DOCKERHUB_USERNAME }}/api-gateway:${{ env.IMAGE_TAG }} -n ${{ env.NAMESPACE }}
          kubectl set image deployment/payment-service payment-service=${{ env.DOCKERHUB_USERNAME }}/payment-service:${{ env.IMAGE_TAG }} -n ${{ env.NAMESPACE }}
          kubectl rollout status deployment/catalog-service -n ${{ env.NAMESPACE }}
          kubectl rollout status deployment/order-service -n ${{ env.NAMESPACE }}
          kubectl rollout status deployment/api-gateway -n ${{ env.NAMESPACE }}
          kubectl rollout status deployment/payment-service -n ${{ env.NAMESPACE }}
